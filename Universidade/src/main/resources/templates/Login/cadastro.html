<!DOCTYPE html>
<html lang="pt-br" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, inicial-scale=1.0">

        <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/login.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

        <title> Universidade Tech de Minas Gerais - Login</title>
    </head>
    <body>
        <div class="Login-form">
            <div class="container">
                <div class="main-div">
                    <div class="texto-header">
                        <h2>Cadastro de Usuario</h2>
                        <p>Crie seu usuário no sistema</p>
                    </div>
                    
                    <form method="post" th:object="${usuario}" action="salvarUsuario">
                        <div class="form-group">
                            <input type="text" class="form-control" th:field="*{nome}" placeholder="username">
                        </div>

                        <div class="form-group">
                            <input type="email" class="form-control" th:field="*{email}" placeholder="exemple@gmail.com">
                        </div>

                        <div class="form-group">
                            <input type="password" class="form-control" th:field="*{senha}" placeholder="Insira sua senha.">
                        </div>


                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                        <button type="button" class="btn btn-info">Voltar</button>
                    </form>

                </div>
            </div>
        </div>

    </body>
    </html>
