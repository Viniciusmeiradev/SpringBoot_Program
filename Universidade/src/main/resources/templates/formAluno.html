<!DOCTYPE html>
<html lang="pt-br" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, inicial-scale=1.0">

        <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/nav.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

        <title> Inserir Alunos</title>
    </head>
    <body>

        <div th:replace="fragments :: cabecalho"></div>

        <div class="container" style="margin-top: 50px;">
            <h4> Inserir Alunos</h4>
            <hr>
            <br>
            
            <form method="post" action="/InsertAlunos" th:objetc="${aluno}">
                <div class="row">
                    <div class="col-md-5 form-group offset-md-3">
                        <label>Nome do Aluno</label>
                        <input class="form-control" placeholder="Ex: Carlos Sanches" th:field="*{nome}">
                    </div>
                </div>

                <did class="row">
                    <div class="col-md-5 form-group offset-md-3">
                        <label>Selecione o Curso</label>
                        <select class="form-control" th:field="*{curso}">
                            <option th:each="curso : ${T(br.com.Universidade.Enums.Curso).values()}" th:value="${curso}" th:text="${curso}"></option>
                        </select>
                    </div>
                </did>

                <div class="row">
                    <div class="col-md-5 form-group offset-md-3">
                        <label>Gerar Matricula</label>
                        <input class="form-control" id="matricula" th:field="*{matricula}"> 
                        <button type="button" onclick="GerarMatricula();" class="btn btn-dark" style="margin-top:10px;">Gerar</button>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-5 form-group offset-md-3">
                        <label>Selecione o Status</label>
                        <select class="form-control" th:field="*{status}">
                            <option th:each="status : ${T(br.com.Universidade.Enums.Status).values()}" th:value="${status}" th:text="${status}"></option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-5 form-group offset-md-3">
                        <label>Selecione seu Turno</label>
                        <select class="form-control" th:field="*{turno}">
                            <option th:each="turno : ${T(br.com.Universidade.Enums.Turno).values()}" th:value="${turno}" th:text="${status}"></option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <button type="submit" class="btn btn-success offset-md-5">SALVAR</button>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <a class="btn btn-outline-danger">VOLTAR</a>
                </div>
            </form>
        </div>

        <script src="js/main.js"></script>
        <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
        <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
