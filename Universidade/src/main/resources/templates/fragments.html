<!DOCTYPE html>
<html lang="pt-br" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, inicial-scale=1.0">

        <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/nav.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

        <title> Universidade Tech de Minas Gerais</title>
    </head>
    <body>
        <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
        <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>

        <!--Cabeçalho-->
        <header th:fragment="cabecalho">
            <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #3333FF">
                <a class="navbar-brand" th:href="@{/}">
                    <img src="/img/logoUni.png" class="ms-4" alt="Logo" width="80px"/>
                </a>

                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMobile">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div id="navMobile" class="navbar-collapse collapse justify-content-end">
                    <a class="btn-nav nav-item nav-link me-3"><i class="fas fa-home"></i> Inicio </a>
                    <a class="btn-nav nav-item nav-link me-3" th:href="@{inserirAlunos}"><i class="fas fa-user-graduate"></i> Cursos </a>
                    <a data-toggle="modal" data-target="#modalPesquisa" class="btn-nav nav-item nav-link me-3"><i class="fas fa-wallet"></i> Pesquisar </a>
                    <a class="btn-nav nav-item nav-link me-3"><i class="fas fa-headset"></i> Atendimento </a>
                    <a class="btn-nav nav-item nav-link me-3"><i class="fas fa-book-reader"></i> Biblioteca </a>
                    <form action="/logout" method="post">
                        <button type="submit" class="btn-nav nav-item nav-link me-3 "><i class="fas fa-times"></i> Sair</button>
                    </form>
                </div>
            </nav>
        </header>

        <!-- RODAPE-->
         <footer th:fragment="rodape">
            <div class="rodape">
                <span> Todos os direitos reservados - 2026 &copy; Vinicius Meira</span>
            </div>
        </footer>
    </body>
</html>
