<!DOCTYPE html>
<html lang="pt-br" xmlns:th="https://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, inicial-scale=1.0">

        <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/nav.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

        <title> Universidade Tech de Minas Gerais</title>
    </head>
    <body>
        <div th:replace="fragments :: cabecalho"></div>
        
        <div class="container" style="margin-top: 50px;">
            <h3>Alunos Encontrados Na Pesquisa</h3>
            <hr>
            <table class="table table-bordered table-hover">
                <thead>
                    <th scope="col">Nome</th>
                    <th scope="col">Curso</th>
                    <th scope="col">Matricula</th>
                    <th scope="col">Status</th>
                    <th scope="col">Turno</th>
                    <th scope="col">Alterações</th>
                </thead>
                <tbody>
                    <tr scope="row" th:each="alunos : ${ListaDeAlunos}">
                        <td th:text="${alunos.nome}"></td>
                        <td th:text="${alunos.curso}"></td>
                        <td th:text="${alunos.matricula}"></td>
                        <td th:text="${alunos.status}"></td>
                        <td th:text="${alunos.turno}"></td>
                        <td>
                            <a class="btn btn-primary" th:href="@{alterar/{id}(id=${alunos.id})}"><i class="fas fa-edit"></i>Editar</a>
                            <a class="btn btn-danger" th:href="@{excluir/{id}(id=$alunos.id)}"><i class="fas fa-times"></i>Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        
        <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
        <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
